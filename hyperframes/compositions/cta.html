<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #cta-root {
          position: absolute;
          inset: 0;
          background: var(--olive);
        }
      </style>
      <div id="cta-root" class="cena" data-layout-allow-overlap data-composition-id="cta" data-width="1080" data-height="1920">
        <h2 id="cta-texto" class="display" style="font-size: 130px; color: var(--cream); margin: 0; text-align: center">Qual é o seu?</h2>
        <div id="cta-handle" class="kicker handle">@seuperfil</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const reveal = { opacity: 0, y: 40, filter: "blur(8px)" };
          const visivel = { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" };
          tl.fromTo("#cta-root", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0);
          tl.fromTo("#cta-texto", { ...reveal, scale: 0.96 }, { ...visivel, scale: 1 }, 0.2);
          tl.fromTo("#cta-handle", reveal, visivel, 0.7);
          window.__timelines["cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
