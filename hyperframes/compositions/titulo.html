<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #titulo-root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="titulo-root" class="cena" data-layout-allow-overlap data-composition-id="titulo" data-width="1080" data-height="1920">
        <div id="titulo-fundo" class="cena-fundo" style="background: var(--cream)">
          <div id="titulo-luz" class="luz"></div>
          <div class="vinheta" ></div>
        </div>
        <div id="titulo-fantasma" class="fantasma" aria-hidden="true" data-layout-ignore style="top: 1340px">pré-treino</div>
        <div id="titulo-conteudo" class="conteudo" data-layout-allow-overlap>
          <svg id="titulo-icone" width="110" height="110" viewBox="0 0 120 120" fill="none" stroke="var(--clay)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 60 L106 60" /><path d="M24 44 L24 76" /><path d="M34 36 L34 84" /><path d="M86 36 L86 84" /><path d="M96 44 L96 76" /></svg>
          <div id="titulo-kicker" class="kicker" style="margin-top: 40px"><span class="kicker-traco" id="titulo-traco"></span><span id="titulo-kicker-texto">Pré-treino</span></div>
          <h1 id="titulo-texto" data-layout-allow-overflow class="display" style="font-size: 168px; letter-spacing: -2px; line-height: 0.98; margin-top: 34px; text-wrap: balance">O que comer 1h antes</h1>
          <div id="titulo-linha" class="rule" style="margin-top: 56px"></div>
          <div id="titulo-sub" style="font-family: 'Inter', sans-serif; font-weight: 300; font-size: 46px; color: var(--muted); margin-top: 40px">Energia leve, sem pesar no estômago</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const reveal = { opacity: 0, y: 40, filter: "blur(8px)" };
          const visivel = { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" };
          // Quebra o texto em palavras mascaradas (revelação editorial)
          const dividir = (sel) => {
            const el = document.querySelector(sel);
            const palavras = el.textContent.trim().split(/\s+/);
            el.innerHTML = palavras.map((w) => `<span class="palavra"><span>${w}</span></span>`).join(" ");
            return el.querySelectorAll(".palavra > span");
          };
          const subir = (alvos, t) =>
            tl.fromTo(alvos, { yPercent: 115, rotation: 6 }, { yPercent: 0, rotation: 0, duration: 0.85, ease: "expo.out", stagger: 0.07 }, t);
          const desenhar = (sel, t, dur = 1.2) => {
            document.querySelectorAll(sel).forEach((p) => {
              const L = p.getTotalLength();
              tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
            });
          };
          const luz = (sel, dur) =>
            tl.fromTo(sel, { x: -120, y: -40 }, { x: 140, y: 80, duration: dur, ease: "sine.inOut" }, 0);
          const sair = (sel, t) =>
            tl.to(sel, { y: -90, opacity: 0, filter: "blur(12px)", scale: 0.97, duration: 0.6, ease: "power2.in" }, t);
          const entrar = (sel) =>
            tl.fromTo(sel, { y: 110, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0);

          luz("#titulo-luz", 3.4);
          tl.fromTo("#titulo-fantasma", { x: 60, opacity: 0 }, { x: -220, opacity: 0.5, duration: 3.4, ease: "none" }, 0);
          desenhar("#titulo-icone path", 0.1);
          tl.fromTo("#titulo-traco", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 0.2);
          tl.fromTo("#titulo-kicker-texto", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 0.3);
          subir(dividir("#titulo-texto"), 0.45);
          tl.fromTo("#titulo-linha", { scaleX: 0 }, { scaleX: 1, duration: 1, ease: "power2.inOut" }, 1.0);
          tl.fromTo("#titulo-sub", reveal, visivel, 1.3);
          sair("#titulo-conteudo", 2.85);
          window.__timelines["titulo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
